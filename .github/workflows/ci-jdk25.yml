name: Java 25 Build

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
          cache: maven
          server-id: github-arenadata
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN
      - name: Set up Toolchain
        shell: bash
        run: |
          mkdir -p $HOME/.m2 \
          && cat << EOF > $HOME/.m2/toolchains.xml
          <?xml version="1.0" encoding="UTF8"?>
          <toolchains>
          <toolchain>
           <type>jdk</type>
             <provides>
               <version>25</version>
               <vendor>adopt</vendor>
             </provides>
             <configuration>
               <jdkHome>${{ env.JAVA_HOME }}</jdkHome>
             </configuration>
          </toolchain>
          </toolchains>
          EOF
      - name: Configure GitHub Packages
        run: |
          mkdir -p "$HOME/.m2"
          cat > "$HOME/.m2/settings.xml" << 'EOF'
          <settings>
            <servers>
              <server>
                <id>github-arenadata</id>
                <username>${env.GITHUB_ACTOR}</username>
                <password>${env.GITHUB_TOKEN}</password>
              </server>
            </servers>
            <profiles>
              <profile>
                <id>github-arenadata</id>
                <repositories>
                  <repository>
                    <id>github-arenadata</id>
                    <url>https://maven.pkg.github.com/arenadata/paimon</url>
                    <releases>
                      <enabled>true</enabled>
                    </releases>
                    <snapshots>
                      <enabled>false</enabled>
                    </snapshots>
                  </repository>
                </repositories>
              </profile>
            </profiles>
            <activeProfiles>
              <activeProfile>github-arenadata</activeProfile>
            </activeProfiles>
          </settings>
          EOF
      - name: Build
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mvn clean install -DskipTests -P '!toolchain' -Papache-build
